name: GoalFit
options:
  bundleIdPrefix: com.goalfit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  GoalFit:
    type: application
    platform: iOS
    sources:
      - path: GoalFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goalfit.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "GoalFit reads your Health data (steps, distance, calories, exercise and weight) to calculate the progress of your goals. Your data never leaves your device."
        ENABLE_PREVIEWS: YES
    entitlements:
      path: GoalFit/Resources/GoalFit.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  GoalFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoalFitTests
    dependencies:
      - target: GoalFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goalfit.app.tests

schemes:
  GoalFit:
    build:
      targets:
        GoalFit: all
    test:
      targets:
        - GoalFitTests
